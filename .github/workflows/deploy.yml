name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The `jib` task graph is compile → jar → push: it never runs a test. So
      # without this step a red suite deployed to prod unnoticed, and the tests
      # only ever ran on whichever laptop remembered to run them.
      # spotlessCheck before build so a formatting failure costs seconds rather
      # than the whole compile+test cycle. It is deliberately narrow — ktlint's
      # reflow rules are disabled in build.gradle.kts because the long
      # explanatory comments here are the documentation, not debt — so a failure
      # means something genuinely mechanical (imports, trailing whitespace) and
      # `./gradlew spotlessApply` always fixes it.
      - name: Build & test
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck build

      # Jib builds one image per app module and pushes:
      #   ghcr.io/nplus-father/bookshelf-echo-{producers,enricher,matcher,digester,publisher}
      - name: Push all images with Jib
        run: ./gradlew jib

  deploy:
    needs: build-and-push
    # Production is the machine the runner lives on, so there is nothing to SSH
    # into (2026-09-20). The previous appleboy/ssh-action hop needed a private
    # key in SERVER_SSH_KEY that could log in as andrew (sudo + docker) and kept
    # public port 22 open for it. nplus-host, not hugobook: hugobook runners are
    # containers without the docker socket or /home/andrew; nplus-host is the
    # host-level andrew-PC-1 runner, running as andrew with docker available.
    runs-on: [self-hosted, nplus-host]
    steps:
      - name: Deploy on the host
        working-directory: /home/andrew/workspace/bookshelf-echo
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u andrewnplus --password-stdin
          git pull --ff-only
          docker compose pull producers enricher matcher digester publisher
          # postgres-exporter 一併列入：它不是五個 app 的依賴，不列的話它的
          # compose 改動永遠不會被套用（2026-07-25 發佈 metrics port 那次
          # 就是這樣漏掉、事後手動補的）。rabbitmq 是 app 的依賴，up -d 會
          # 順帶重建，不用列。
          docker compose up -d producers enricher matcher digester publisher postgres-exporter
          # site-publisher runs a mounted script (config/site-publish.sh) as a
          # long-lived process — it reads the script once at start. Plain `up -d`
          # sees no image/config diff and leaves it alone, so a script change would
          # silently keep running the old copy (caused the 2026-07-12 publishing
          # outage). `restart` reloads the script but does NOT apply changed
          # `environment:` — a var added to docker-compose.yml never reached the
          # container, which is how SITE_VERSION_URL silently no-op'd on 2026-07-25.
          # --force-recreate is the only one that does both.
          docker compose up -d --force-recreate site-publisher
          docker image prune -f
          echo "bookshelf-echo deploy completed at $(date)"
