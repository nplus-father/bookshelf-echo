# Local/host stack for bookshelf-echo. Zero-inbound posture (ADR-006): every port
# binds to 127.0.0.1 only — the pipeline needs egress exclusively, the public
# face is the statically built site on GitHub Pages.
#
# One deliberate exception (ADR-006 amendment, 2026-07-25): metrics ports also
# bind to 172.30.0.1, the k8s-docker-bridge gateway, so the kube-prometheus-stack
# in k3s can scrape them — k8s pods cannot reach docker container IPs, published
# ports on 172.30.0.1 are the only route (see nplus-infra docs/k3s-migration.md).
# That address is not public: it lives on an internal bridge, and ufw only admits
# the pod CIDR (10.42.0.0/16). Zero-INBOUND-from-the-internet still holds.
name: bookshelf-echo

# Docker 預設的 json-file 沒有大小上限,log 只會單調成長,永遠不會自己回收。
# 這台 host 沒有 /etc/docker/daemon.json 且 sudo 需要密碼,全域設不了,
# 只能逐服務掛 —— 而且要容器重建才生效,單純 restart 不會套用。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # rabbitmq 服務已於 2026-08-25 搬進 nplus-infra 的 compose（擁有權歸位）：
  # broker 是全站共用基礎設施（vhost `/` 給這裡、vhost `voice` 給 nplus-backend
  # ＋voice-worker），不該由其中一個消費者的 repo 定義——voice 上線時得來這裡
  # 加 5672 綁定（f350ac9）就是症狀。資料原封不動：volume
  # `bookshelf-echo_rabbitmq-data` 與 hostname `bookshelf-echo-rabbitmq`
  # （data dir 綁 hostname，355d99f）都由 infra 那邊沿用。
  # 本 repo 的五個 app 改經 infra-shared-network 連同名 `rabbitmq`；
  # 帳密仍在這裡的 .env（client 端），broker 種子帳號歸 nplus-infra/.env。

  # postgres 服務已退役（2026-07-26）：資料庫 2026-07-20 真遷移進 CNPG
  # （10.43.77.92，見 nplus-infra docs/k3s-migration.md Phase 3），舊容器
  # 凍結 idle 觀察期滿、實測 0 連線後移除。pg-data volume
  # （bookshelf-echo_pg-data）在 docker 裡再留幾天當最後保險，
  # 7/27 之後 docker volume rm 拆掉。

  flyway:
    image: flyway/flyway:11
    logging: *default-logging
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://${POSTGRES_HOST:?set in .env}:5432/${POSTGRES_DB:-airadar}
      FLYWAY_USER: ${POSTGRES_USER:-airadar}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./db/migrations:/flyway/sql:ro

  # ---- pipeline apps (JVM, Jib images) ---------------------------------------
  # Each joins the bookshelf-echo default net (talking among themselves) and
  # the external infra-shared-network — since 2026-08-25 that is also where
  # `rabbitmq` resolves (the broker moved to the nplus-infra stack), on top of
  # the original reason (Prometheus scraping the 127.0.0.1-free metrics port). Config comes from .env; the vars below override
  # it for in-container networking. Postgres lives in CNPG (POSTGRES_HOST in
  # .env points at its ClusterIP). Metrics ports are published to 172.30.0.1
  # only (kps scrape — ADR-006 exception in the header), never to a public
  # interface.
  #
  # The *_PORT vars in .env are HOST bindings and may be remapped to dodge a
  # conflict; inside the network each service always listens on its stock port,
  # so they are pinned here rather than inherited from .env.
  producers:
    image: ${BOOKSHELF_ECHO_PRODUCERS_IMAGE:-ghcr.io/nplus-father/bookshelf-echo-producers:latest}
    logging: *default-logging
    container_name: bookshelf-echo-producers
    ports:
      - "172.30.0.1:9101:9101"   # kps scrape
    env_file: [.env]
    environment: &app-env
      DATABASE_URL: jdbc:postgresql://${POSTGRES_HOST:?set in .env}:5432/${POSTGRES_DB:-airadar}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_MGMT_PORT: "15672"
      METRICS_BIND: 0.0.0.0
    depends_on:
      flyway: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [default, infra-shared]

  enricher:
    image: ${BOOKSHELF_ECHO_ENRICHER_IMAGE:-ghcr.io/nplus-father/bookshelf-echo-enricher:latest}
    logging: *default-logging
    container_name: bookshelf-echo-enricher
    ports:
      - "172.30.0.1:9102:9102"   # kps scrape
    env_file: [.env]
    environment: *app-env
    depends_on:
      flyway: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [default, infra-shared]

  # Resonance gate (ADR-010): needs library-bridge on infra-shared-network
  # (the nplus-infra stack). Outbound HTTP only — zero-inbound holds.
  matcher:
    image: ${BOOKSHELF_ECHO_MATCHER_IMAGE:-ghcr.io/nplus-father/bookshelf-echo-matcher:latest}
    logging: *default-logging
    container_name: bookshelf-echo-matcher
    ports:
      - "172.30.0.1:9105:9105"   # kps scrape
    env_file: [.env]
    environment: *app-env
    depends_on:
      flyway: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [default, infra-shared]

  digester:
    image: ${BOOKSHELF_ECHO_DIGESTER_IMAGE:-ghcr.io/nplus-father/bookshelf-echo-digester:latest}
    logging: *default-logging
    container_name: bookshelf-echo-digester
    ports:
      - "172.30.0.1:9103:9103"   # kps scrape
    env_file: [.env]
    environment: *app-env
    depends_on:
      flyway: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [default, infra-shared]

  publisher:
    image: ${BOOKSHELF_ECHO_PUBLISHER_IMAGE:-ghcr.io/nplus-father/bookshelf-echo-publisher:latest}
    logging: *default-logging
    container_name: bookshelf-echo-publisher
    ports:
      - "172.30.0.1:9104:9104"   # kps scrape
    env_file: [.env]
    environment:
      <<: *app-env
      # Pinned here, not inherited: this is a path inside the container, and the
      # bind mount below is what decides where it lands on the host. The host
      # .env used to also set it (to a stale ai-radar path) — dead weight that
      # this line always overrode, removed from prod 2026-08-16.
      CONTENT_DIR: /app/content
    volumes:
      - ./out/content:/app/content     # daily/weekly markdown persists on the host
    depends_on:
      flyway: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [default, infra-shared]

  # ---- site auto-publisher --------------------------------------------------
  # Syncs the publisher's markdown into the sibling bookshelf-echo-site checkout and
  # pushes it, so GitHub Actions rebuilds the public Astro site
  # (nplus.wiki/bookshelf-echo-site). Keeps the JRE publisher image git-free.
  site-publisher:
    image: alpine/git
    logging: *default-logging
    # Run as andrew (host uid:gid 1000) so git objects written into the bind-mounted
    # /repo/.git stay host-owned. As root the sidecar produced root:root objects that
    # broke `git fetch`/`rebase` from the host shell (insufficient permission). uid 1000
    # has no /etc/passwd entry in alpine/git, so HOME must point at a writable dir or
    # `git config --global` (below) can't write ~/.gitconfig.
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/scripts/site-publish.sh"]
    volumes:
      - ./out/content:/src:ro
      - ../bookshelf-echo-site:/repo
      - ./config/site-publish.sh:/scripts/site-publish.sh:ro
      # 每輪的成敗寫成 node-exporter textfile 指標給 Grafana 叫。這條管線壞掉時
      # 是安靜的（容器 Up、publisher 照寫、只有 push 出不去），兩次停更都是靠人
      # 發現沒收到文章才查出來。目錄是 nplus-infra 的，uid 1000 可寫。
      - ${SITE_PUBLISH_TEXTFILE_DIR:-../nplus-infra/data/node-exporter-textfile}:/textfile
    environment:
      HOME: /tmp
      SITE_GIT_TOKEN: ${SITE_GIT_TOKEN:?set in .env}
      SYNC_INTERVAL_SECONDS: "300"
      # 每輪去問線上站台自己是哪個 commit，用來守 push 成功之後、GitHub Pages
      # 之前的那一段（見 site-publish.sh 的 deploy check）。這份 JSON 由共用
      # workflow astro-build-deploy.yml 在 build 時寫進 dist/。留空就跳過檢查。
      #
      # 用 nplus.wiki 這個自訂網域而不是 nplus-father.github.io：後者會 301 轉過來
      # （busybox wget 跟得動，但那是白繞一跳），而且監控本來就該量使用者真正
      # 打到的那個位址。astro.config.mjs 的 site 仍寫著 github.io，那份設定是舊的。
      SITE_VERSION_URL: "https://nplus.wiki/bookshelf-echo-site/version.json"
    depends_on:
      - publisher
    restart: unless-stopped

  # Postgres 指標 —— 這個 DB 裝著 essays、llm_usage、items,是整條 pipeline
  # 唯一的持久狀態。DB 本體在 CNPG（POSTGRES_HOST 指 ClusterIP），這個
  # exporter 從 docker 回頭連過去抓 —— 雙軌期為了 dashboard/rules 的 pg_*
  # 指標 parity 留著,長期正解是 CNPG 的 enablePodMonitor（cnpg_* 指標）。
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: bookshelf-echo-postgres-exporter
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "172.30.0.1:9187:9187"   # kps scrape
    environment:
      # 刻意不用 DATA_SOURCE_NAME 的單一 URL 形式:密碼含 "/" 之類的字元會讓
      # URL 解析失敗,而 exporter 的錯誤訊息會把完整 DSN（含密碼）印進 log。
      # 拆成三個變數就沒有編碼問題,也不會有人需要在 compose 裡手動 urlencode。
      DATA_SOURCE_URI: "${POSTGRES_HOST:?set in .env}:5432/${POSTGRES_DB:-airadar}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:-airadar}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD:?set in .env}"
    networks:
      - default
      - infra-shared

networks:
  # bookshelf-echo's own bridge (auto-created as bookshelf-echo_default) is referenced as
  # `default`; infra-shared-network is created by the nplus-infra stack.
  infra-shared:
    name: infra-shared-network
    external: true
